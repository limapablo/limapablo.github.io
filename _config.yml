title: Pablo Lima
description: Data Analyst and Business Intelligence portfolio focused on Power BI, SQL, Python, automation, operational analytics and process improvement.
baseurl: ""
url: "https://limapablo.com"
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
github_username: limapablo
linkedin_username: limapablo
locale: "en-US"
minimal_mistakes_skin: "dark"
search: false
breadcrumbs: false
markdown: kramdown

atom_feed:
  hide: true

collections:
  pages:
    output: true
    permalink: /:path/

include:
  - _pages

plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

author:
  name: "Pablo Lima"
  avatar: "/images/profile.png"
  bio: "Data Analyst focused on business intelligence, automation, operational analytics and process improvement."
  location: "Rio de Janeiro, Brazil"
  links:
    - label: "Contact"
      icon: "fas fa-fw fa-envelope"
      url: "/contact/"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/limapablo/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/limapablo"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0009-0007-6456-6993"
    - label: "Lattes"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://lattes.cnpq.br/3015923614657329"

footer:
  links:
    - label: "Contact"
      icon: "fas fa-fw fa-envelope"
      url: "/contact/"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/limapablo/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/limapablo"
    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0009-0007-6456-6993"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      classes: wide
